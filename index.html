<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciągnij Losy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4ecd8;
  --paper-dark:#e9dcb8;
  --ink:#2b2620;
  --red:#ac3626;
  --red-dark:#7e2419;
  --brass:#a6822f;
  --brass-light:#e3c877;
  --teal:#1f6f5c;
  --muted:#8a7f68;
  --shadow: 0 8px 22px rgba(43,38,32,0.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 10%, rgba(172,54,38,0.05), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(31,111,92,0.05), transparent 40%),
    var(--paper);
  color:var(--ink);
  font-family:'Nunito', sans-serif;
  min-height:100vh;
  padding:32px 16px 70px;
}
.wrap{max-width:760px;margin:0 auto;}

header{text-align:center;margin-bottom:30px;}
.eyebrow{
  font-size:12px;letter-spacing:0.35em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:6px;
}
h1{
  font-family:'Anton', sans-serif;font-weight:400;
  font-size:clamp(38px,7vw,58px);letter-spacing:0.02em;
  color:var(--red);margin:0;
  text-shadow:2px 2px 0 rgba(43,38,32,0.08);
}
.subtitle{
  font-family:'Caveat', cursive;font-size:22px;
  color:var(--brass);font-weight:700;margin-top:4px;
}

/* ===== SETTINGS CARD ===== */
.settings-card{
  background:#fffdf6;border:2px solid var(--paper-dark);
  border-radius:14px;padding:22px;box-shadow:var(--shadow);
  margin-bottom:28px;
}
.settings-row{
  display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;
}
.field{flex:1;min-width:130px;}
.field label{
  display:block;font-size:12px;font-weight:800;text-transform:uppercase;
  letter-spacing:0.1em;color:var(--muted);margin-bottom:6px;
}
.field input{
  width:100%;font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;
  padding:10px 12px;border-radius:8px;border:2px solid var(--paper-dark);
  background:var(--paper);color:var(--ink);
}
.field input:focus{outline:none;border-color:var(--brass);}
.settings-actions{display:flex;justify-content:center;}

button.btn{
  font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;
  letter-spacing:0.03em;padding:14px 30px;border-radius:9px;border:none;
  cursor:pointer;transition:transform .12s ease, filter .15s ease;
}
button.btn:active{transform:scale(0.96);}
button.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-primary{background:var(--red);color:#fdf3e7;box-shadow:0 4px 0 var(--red-dark);}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);}
.btn-primary:active:not(:disabled){box-shadow:0 1px 0 var(--red-dark);transform:translateY(3px) scale(0.98);}
.btn-secondary{background:transparent;color:var(--ink);border:2px solid var(--paper-dark);padding:12px 24px;}
.btn-secondary:hover{border-color:var(--brass);color:var(--brass);}
.btn-ghost{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;cursor:pointer;padding:4px;}

/* ===== DRAW STAGE ===== */
.stage[hidden]{display:none;}
.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}
.counter{text-align:center;font-size:13px;color:var(--muted);margin:10px 0 22px;letter-spacing:0.04em;}
.counter b{color:var(--red);font-size:16px;}

.drum{display:flex;justify-content:center;margin-bottom:22px;}
.ball-slot{
  width:96px;height:96px;border-radius:50%;
  border:3px dashed var(--paper-dark);
  display:flex;align-items:center;justify-content:center;
  font-family:'Anton',sans-serif;font-size:34px;color:var(--paper-dark);
  background:#fffdf6;transition:transform .15s ease;
}
.ball-slot.rolling{animation:rollShake .08s infinite;}
@keyframes rollShake{
  0%{transform:rotate(-4deg);} 50%{transform:rotate(4deg);} 100%{transform:rotate(-4deg);}
}

.drawn-numbers{
  display:flex;flex-wrap:wrap;gap:14px;justify-content:center;
  margin-bottom:26px;min-height:80px;
}
.ball{
  width:64px;height:64px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Anton',sans-serif;font-size:22px;color:#fdf3e7;
  background: radial-gradient(circle at 32% 28%, var(--brass-light), var(--red) 65%, var(--red-dark) 100%);
  box-shadow:0 5px 12px rgba(43,38,32,0.3), inset 0 2px 3px rgba(255,255,255,0.35);
  animation:popIn .4s cubic-bezier(.2,.9,.3,1.3) both;
}
@keyframes popIn{
  0%{transform:scale(0) rotate(-30deg);opacity:0;}
  100%{transform:scale(1) rotate(0);opacity:1;}
}

.reveal-banner{
  text-align:center;min-height:30px;font-family:'Anton',sans-serif;
  font-size:20px;color:var(--red);letter-spacing:0.02em;margin-bottom:22px;
}

.history-wrap{
  background:#fffdf6;border:2px solid var(--paper-dark);
  border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);
}
.history-wrap .title{
  font-size:12px;font-weight:800;text-transform:uppercase;
  letter-spacing:0.12em;color:var(--muted);margin-bottom:10px;
}
.history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.history li{
  display:flex;align-items:center;gap:10px;font-size:14px;
  padding:6px 8px;border-radius:6px;background:var(--paper);flex-wrap:wrap;
}
.history li .badge{font-family:'Anton',sans-serif;font-size:11px;color:var(--muted);min-width:60px;}
.history li .set-numbers{display:flex;gap:6px;flex-wrap:wrap;}
.history li .mini-ball{
  font-family:'Anton',sans-serif;font-size:13px;color:#fdf3e7;
  background:var(--teal);width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.history-empty{color:var(--muted);font-size:13px;font-style:italic;}

footer{text-align:center;color:var(--muted);font-size:11px;margin-top:34px;letter-spacing:0.06em;}
footer .reset-link{margin-top:6px;}

@media (prefers-reduced-motion: reduce){
  .ball, .ball-slot{animation:none !important;}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">ciagnijlosy.pl</div>
    <h1>Ciągnij Losy</h1>
    <div class="subtitle">ustaw zakres, wylosuj liczby</div>
  </header>

  <div class="settings-card" id="settingsCard">
    <div class="settings-row">
      <div class="field">
        <label for="rangeFrom">Od</label>
        <input type="number" id="rangeFrom" value="1" min="0">
      </div>
      <div class="field">
        <label for="rangeTo">Do</label>
        <input type="number" id="rangeTo" value="15" min="1">
      </div>
      <div class="field">
        <label for="howMany">Ile liczb wylosować</label>
        <input type="number" id="howMany" value="6" min="1">
      </div>
    </div>
    <div class="settings-actions">
      <button class="btn btn-primary" id="startBtn">Rozpocznij losowanie</button>
    </div>
  </div>

  <div class="stage" id="stage" hidden>
    <div class="drum">
      <div class="ball-slot" id="ballSlot">?</div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="drawBtn">Losuj liczbę!</button>
      <button class="btn btn-secondary" id="drawAllBtn">Losuj wszystkie naraz</button>
    </div>

    <div class="counter">Wylosowano: <b id="drawnCount">0</b> / <span id="totalCount">0</span></div>

    <div class="reveal-banner" id="revealBanner"></div>

    <div class="drawn-numbers" id="drawnNumbers"></div>

    <div class="controls" style="margin-top:6px;">
      <button class="btn btn-secondary" id="newDrawBtn">Nowe losowanie</button>
    </div>

    <div class="history-wrap" style="margin-top:22px;">
      <div class="title">Historia losowań</div>
      <ul class="history" id="historyList"></ul>
    </div>
  </div>

  <footer>
    Losowanie odbywa się w Twojej przeglądarce &middot; algorytm Fishera–Yatesa
    <div class="reset-link"><button class="btn-ghost" id="resetAllBtn">Usuń wszystkie dane</button></div>
  </footer>

</div>

<script>
(function(){
  const settingsCard = document.getElementById('settingsCard');
  const rangeFrom = document.getElementById('rangeFrom');
  const rangeTo = document.getElementById('rangeTo');
  const howMany = document.getElementById('howMany');
  const startBtn = document.getElementById('startBtn');

  const stage = document.getElementById('stage');
  const ballSlot = document.getElementById('ballSlot');
  const drawBtn = document.getElementById('drawBtn');
  const drawAllBtn = document.getElementById('drawAllBtn');
  const drawnCountEl = document.getElementById('drawnCount');
  const totalCountEl = document.getElementById('totalCount');
  const revealBanner = document.getElementById('revealBanner');
  const drawnNumbersEl = document.getElementById('drawnNumbers');
  const newDrawBtn = document.getElementById('newDrawBtn');
  const resetAllBtn = document.getElementById('resetAllBtn');
  const historyList = document.getElementById('historyList');

  let pool = [];
  let drawnSet = [];
  let target = 0;
  let rollTimer = null;

  function fisherYates(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function renderHistoryEmpty(){
    historyList.innerHTML = '<li class="history-empty">Jeszcze nic nie wylosowano — naciśnij "Losuj liczbę!"</li>';
  }

  function addHistoryEntry(numbers){
    const empty = historyList.querySelector('.history-empty');
    if(empty) empty.remove();
    const li = document.createElement('li');
    const time = new Date().toLocaleTimeString('pl-PL', {hour:'2-digit', minute:'2-digit'});
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = time;
    const setWrap = document.createElement('span');
    setWrap.className = 'set-numbers';
    numbers.forEach(n=>{
      const b = document.createElement('span');
      b.className = 'mini-ball';
      b.textContent = n;
      setWrap.appendChild(b);
    });
    li.appendChild(badge);
    li.appendChild(setWrap);
    historyList.insertBefore(li, historyList.firstChild);
  }

  function startDraw(){
    let from = parseInt(rangeFrom.value, 10);
    let to = parseInt(rangeTo.value, 10);
    let count = parseInt(howMany.value, 10);

    if(isNaN(from)) from = 1;
    if(isNaN(to)) to = 15;
    if(to < from){ [from, to] = [to, from]; }
    const totalAvailable = to - from + 1;
    if(isNaN(count) || count < 1) count = 1;
    if(count > totalAvailable) count = totalAvailable;

    pool = fisherYates(Array.from({length: totalAvailable}, (_, i) => from + i));
    drawnSet = [];
    target = count;

    drawnCountEl.textContent = '0';
    totalCountEl.textContent = String(target);
    drawnNumbersEl.innerHTML = '';
    ballSlot.textContent = '?';
    revealBanner.textContent = 'Losowanie gotowe. Naciśnij "Losuj liczbę!"';
    renderHistoryEmpty();
    drawBtn.disabled = false;
    drawAllBtn.disabled = false;

    stage.hidden = false;
    stage.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function popBall(number){
    const ball = document.createElement('div');
    ball.className = 'ball';
    ball.textContent = number;
    drawnNumbersEl.appendChild(ball);
  }

  function finishIfDone(){
    if(drawnSet.length >= target){
      drawBtn.disabled = true;
      drawAllBtn.disabled = true;
      revealBanner.textContent = 'Losowanie zakończone!';
      addHistoryEntry(drawnSet.slice());
    }
  }

  function drawOne(){
    if(pool.length === 0 || drawnSet.length >= target) return;

    ballSlot.classList.add('rolling');
    let ticks = 0;
    clearInterval(rollTimer);
    rollTimer = setInterval(()=>{
      const from = parseInt(rangeFrom.value,10) || 1;
      const to = parseInt(rangeTo.value,10) || 15;
      ballSlot.textContent = Math.floor(Math.random()*(to-from+1))+from;
      ticks++;
      if(ticks > 8){
        clearInterval(rollTimer);
        ballSlot.classList.remove('rolling');
        const number = pool.pop();
        drawnSet.push(number);
        ballSlot.textContent = number;
        popBall(number);
        drawnCountEl.textContent = String(drawnSet.length);
        revealBanner.innerHTML = `Wylosowano: <b>${number}</b>`;
        finishIfDone();
      }
    }, 60);
  }

  function drawAll(){
    drawAllBtn.disabled = true;
    drawBtn.disabled = true;
    const remaining = target - drawnSet.length;
    let i = 0;
    const interval = setInterval(()=>{
      if(i >= remaining || pool.length === 0){
        clearInterval(interval);
        finishIfDone();
        return;
      }
      const number = pool.pop();
      drawnSet.push(number);
      ballSlot.textContent = number;
      popBall(number);
      drawnCountEl.textContent = String(drawnSet.length);
      revealBanner.innerHTML = `Wylosowano: <b>${number}</b>`;
      i++;
      if(drawnSet.length >= target){
        clearInterval(interval);
        finishIfDone();
      }
    }, 350);
  }

  startBtn.addEventListener('click', startDraw);
  drawBtn.addEventListener('click', drawOne);
  drawAllBtn.addEventListener('click', drawAll);
  newDrawBtn.addEventListener('click', ()=>{
    stage.hidden = true;
    settingsCard.scrollIntoView({behavior:'smooth', block:'start'});
  });
  resetAllBtn.addEventListener('click', ()=>{
    stage.hidden = true;
    rangeFrom.value = 1;
    rangeTo.value = 15;
    howMany.value = 6;
    historyList.innerHTML = '';
  });

  fetch('/api/log-visit', { method: 'POST' }).catch(()=>{});
})();
</script>
</body>
</html>
